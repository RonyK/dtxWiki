# gitleaks configuration for the CI leak scan (.github/workflows/ci.yml).
# The default rules stay on. Each allowlist below is scoped to ONE file and to
# the generic-api-key heuristic only, so a provider token (GitHub, AWS, Stripe,
# a PEM key, ...) pasted into the same file is still reported.
[extend]
useDefault = true

[[allowlists]]
description = "SHA-256 digests of the frozen migration files are not secrets"
targetRules = ["generic-api-key"]
paths = ['''backend/migrations/frozen_revisions\.json$''']

[[allowlists]]
description = "A retired Alembic revision identifier used as test data"
targetRules = ["generic-api-key"]
paths = ['''backend/tests/unit/test_revision_classifier_after_freeze\.py$''']

[[allowlists]]
description = "Deterministic synthetic graph corpus labels are not API keys"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/e2e/prepare_backend_db\.py$''']
regexTarget = "secret"
regexes = ['''^e2e-knowledge-10k(?:-aggregated)?$''']

[[allowlists]]
description = "The SQLAlchemy populate_existing flag is Python code, not an API key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^backend/services/indexing/co_read_source\.py$''']
regexTarget = "secret"
regexes = ['''^populate_existing=True$''']

[[allowlists]]
description = "The historical frontmatter length limit is Python code, not an API key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^backend/utils/page_frontmatter\.py$''']
regexTarget = "secret"
regexes = ['''^max_length=48$''']

[[allowlists]]
description = "The deterministic density-test graph seed is not an API key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^backend/tests/integration/test_synthetic_corpus_profiles\.py$''']
regexTarget = "secret"
regexes = ['''^scale-1000-density-4x$''']
