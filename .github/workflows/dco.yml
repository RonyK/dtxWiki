name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  signoff:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify DCO sign-off
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0

          while read -r commit; do
            if ! git log -1 --format=%B "$commit" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error title=Missing DCO sign-off::Commit $commit does not include a Signed-off-by line."
              missing=1
            fi
          done < <(git rev-list "${base}..${head}")

          if [ "$missing" -ne 0 ]; then
            echo "Add sign-offs with 'git commit -s', 'git commit --amend --signoff', or 'git rebase --signoff'."
            exit 1
          fi
