services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dtxwiki}
      POSTGRES_USER: ${POSTGRES_USER:-dtxwiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dtxwiki}
    ports:
      - "127.0.0.1:${DTXWIKI_POSTGRES_HOST_PORT:-21432}:5432"
    volumes:
      - dtxwiki-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtxwiki} -d ${POSTGRES_DB:-dtxwiki}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dtxwiki-postgres:
